# /etc/nginx/sites-available/sheplates   (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx)
# Use certbot for the certificates:  certbot --nginx -d app.sheplates.com -d staging.sheplates.com
upstream sheplates_prod    { server 127.0.0.1:3000; keepalive 16; }
upstream sheplates_staging { server 127.0.0.1:3001; keepalive 16; }

server { listen 80; server_name app.sheplates.com staging.sheplates.com; return 301 https://$host$request_uri; }

# Correct file types: the old host served PDFs and the web manifest as application/octet-stream, which stops them opening in the browser.
types {
  application/pdf pdf;
  application/manifest+json webmanifest;
}

server {
  listen 443 ssl http2;
  server_name app.sheplates.com;
  ssl_certificate     /etc/letsencrypt/live/app.sheplates.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.sheplates.com/privkey.pem;
  client_max_body_size 25m;                      # certificates, product images, short videos
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  location /_next/static/ { proxy_pass http://sheplates_prod; expires 365d; add_header Cache-Control "public, immutable"; }
  location ~* \.(pdf|webmanifest)$ { proxy_pass http://sheplates_prod; expires 1h; }
  # Scheduled-job and webhook endpoints are reachable from the internet on purpose; each checks its own secret or signature.
  location / {
    proxy_pass http://sheplates_prod;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;               # the real visitor address is recorded on signatures
    proxy_set_header X-Forwarded-For $remote_addr;         # overwrite, so visitors cannot fake it
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

server {
  listen 443 ssl http2;
  server_name staging.sheplates.com;
  ssl_certificate     /etc/letsencrypt/live/app.sheplates.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.sheplates.com/privkey.pem;
  client_max_body_size 25m;
  add_header X-Robots-Tag "noindex, nofollow" always;    # staging must never appear in Google
  auth_basic "Sheplates staging"; auth_basic_user_file /etc/nginx/.htpasswd-staging;
  location / {
    proxy_pass http://sheplates_staging;
    proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme;
  }
}
