<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ShePlates</title>
<style>
  :root { --plum: #512D3A; --terracotta: #C65D3A; --ivory: #FAF7F2; --text: #292526; --muted: #665B5D; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: var(--ivory); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
  img { width: 72px; height: 72px; border-radius: 50%; }
  h1 { margin: 6px 0 0; font-size: 24px; color: var(--plum); }
  p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--muted); }
  button { margin-top: 10px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--terracotta); color: #fff; font: 700 16px/1 -apple-system, "Segoe UI", Roboto, sans-serif; }
  button:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="">
  <h1>You're offline</h1>
  <p>ShePlates needs an internet connection to show kitchens, orders and your account. Check your connection and try again.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  var target = "https://app.sheplates.com";
  document.getElementById("retry").addEventListener("click", function () { location.replace(target); });
  window.addEventListener("online", function () { location.replace(target); });
</script>
</body>
</html>
