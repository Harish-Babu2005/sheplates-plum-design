name: iPhone App Store build

# Builds the signed .ipa and (optionally) uploads it to App Store Connect / TestFlight.
# Run it from the Actions tab (Run workflow) or push a tag like mobile-v1.0.0.
# Secrets: APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (the AuthKey .p8 text), APPLE_TEAM_ID.
# The API key needs the App Manager or Admin role. Signing is automatic: Xcode creates the distribution certificate
# and profile for com.sheplates.app through the API key. Create the app record in App Store Connect first.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (TestFlight)
        type: boolean
        default: true
  push:
    tags: ["mobile-v*"]

jobs:
  ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Write the App Store Connect key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION=1.0.0
      - name: Export the .ipa
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          mkdir -p ../out && cp "$RUNNER_TEMP"/export/*.ipa ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: sheplates-ios-release
          path: out/*.ipa
      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: xcrun altool --upload-app --type ios --file ../out/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
